worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile           on;
    keepalive_timeout  65;
    # Disk writes per request would show up in the measurement as jitter.
    access_log         off;

    server {
        listen 80 default_server;

        # Every request goes straight to Laravel's front controller. nginx and
        # php-fpm are separate containers and do not share a filesystem, so
        # there is deliberately no `root` / `try_files` here: nginx cannot
        # stat files that live inside the api image, and this is an API with no
        # static assets to serve anyway.
        location / {
            include        fastcgi_params;
            fastcgi_pass   api:9000;

            # Paths as php-fpm sees them, inside the api container.
            fastcgi_param  SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param  SCRIPT_NAME     /index.php;
            fastcgi_param  DOCUMENT_ROOT   /app/public;
            fastcgi_param  HTTP_PROXY      "";

            # A saturated worker pool should surface to k6 as slow-then-504,
            # which is what a real user experiences. Giving up in 1s would
            # report a connection error and hide the actual saturation curve.
            fastcgi_read_timeout 60s;
            fastcgi_buffering    off;
        }
    }
}
