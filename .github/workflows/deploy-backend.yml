# Deploys the Laravel backend to the Namecheap cPanel host over SSH.
# Triggered by pushes to main that touch backend/ (or manually).
# Tests gate the deploy: PHPUnit runs first, SSH deploy only on green.
#
# Required GitHub secrets:
#   DEPLOY_SSH_HOST  — server hostname or shared IP (cPanel sidebar)
#   DEPLOY_SSH_USER  — cPanel username
#   DEPLOY_SSH_KEY   — private key whose public half is authorized in
#                      cPanel → SSH Access → Manage SSH Keys
#   DEPLOY_SSH_PORT  — 21098 on Namecheap shared hosting (not 22)
#
# Optional GitHub variables (Settings → Variables → Actions):
#   DEPLOY_PATH — repo path on the server (default: ~/pawpawcare)
#   PHP_BIN     — PHP CLI to use remotely (default: php). On Namecheap this
#                 may need e.g. /opt/alt/php85/usr/bin/php if the SSH shell's
#                 default `php` is older than the domain's PHP version.

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
    steps:
      - uses: actions/checkout@v7

      # secrets aren't readable in job-level `if`, so surface the check here.
      - name: Check deploy secrets exist
        id: gate
        run: echo "deployable=${{ secrets.DEPLOY_SSH_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, bcmath, zip, intl, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: SSH deploy to api.pawpawcare.app
    needs: test
    # Skips (instead of failing) until the SSH secrets are configured.
    if: ${{ needs.test.outputs.deployable == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        # Pinned to a commit: `@v1` once silently dropped `script_stop`, which
        # changed how this script ran without any review. Dependabot
        # (github-actions) proposes bumps.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          # Rules for editing this script (the host's login shell is bash):
          # - `set -e` stops at the first failed step, and the EXIT trap then
          #   puts the PREVIOUS release back (code, vendor, caches), so a
          #   failure never leaves new code running on old caches.
          # - Steps that must never fail a deploy end in `|| echo`/`|| true`.
          # - Migrations are not reversed on rollback. Keep them additive, so
          #   the previous release still runs on a partly migrated schema.
          script: |
            set -e
            export PHP_BIN="${{ vars.PHP_BIN || 'php' }}"
            cd ${{ vars.DEPLOY_PATH || '~/pawpawcare' }}
            APP=$(pwd)
            COMPOSER="$(command -v composer || echo $HOME/bin/composer)"
            PREV=""
            rollback() {
              st=$?
              [ "$st" -eq 0 ] || [ -z "$PREV" ] && exit "$st"
              set +e
              echo "::error::Deploy failed (exit $st). Rolling back to $PREV."
              cd "$APP" && git reset --hard "$PREV" && cd backend \
                && "$PHP_BIN" "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction \
                && git rev-parse --short HEAD > .release \
                && "$PHP_BIN" artisan config:cache && "$PHP_BIN" artisan route:cache \
                && echo "Rolled back to $(cat .release)." \
                || echo "::error::ROLLBACK FAILED: production may be half-updated. SSH in and fix it now."
              "$PHP_BIN" artisan queue:restart >/dev/null 2>&1
              exit "$st"
            }
            trap rollback EXIT
            # Refuse to deploy without a real JWT signing key (JwtSecretGuard
            # would otherwise disable sign-in). Runs before any change, so the
            # live app stays untouched. The value is never printed. The read
            # can't fail on its own (`|| true`), so a missing .env reaches the
            # error below instead of dying silently under `set -e`.
            SK=$(sed -n 's/^SECRET_KEY=//p' backend/.env 2>/dev/null | tail -n 1 | tr -d '"\r') || true
            if [ "${#SK}" -lt 32 ] || [ "$SK" = "change-me-to-a-long-random-secret-in-production" ]; then
              echo "::error::backend/.env SECRET_KEY is missing, shorter than 32 chars, or the .env.example placeholder. Set it (openssl rand -base64 48) and re-run. Nothing was deployed."
              exit 1
            fi
            unset SK
            git fetch origin main
            # From here on a failure rolls back to this commit.
            PREV=$(git rev-parse HEAD)
            git reset --hard origin/main
            cd backend
            "$PHP_BIN" "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction
            "$PHP_BIN" artisan migrate --force
            # Release (short SHA) for Sentry events and cron check-ins; read by
            # config/sentry.php, so it also survives a later config:clear.
            git rev-parse --short HEAD > .release
            "$PHP_BIN" artisan config:cache
            # Mail config + SMTP login. Never fails the deploy: a failure is
            # printed here and logged as an error (Sentry).
            "$PHP_BIN" artisan mail:check || echo "::warning::mail:check failed: password-reset and verification emails may not be delivered (see output above)."
            # Upload disks (R2): write/read/delete + public and presigned
            # fetches. Same rule: a warning and a Sentry error, never a failed deploy.
            "$PHP_BIN" artisan uploads:check || echo "::warning::uploads:check failed: photo and document uploads may be failing (see output above)."
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan queue:restart || true

      - name: Health check
        # Also after a failed deploy, so the log says what production is
        # actually serving (the rolled-back release, or a broken one).
        if: ${{ always() }}
        run: |
          sleep 5
          status=$(curl -s -o /dev/null -w "%{http_code}" -m 20 https://api.pawpawcare.app/health)
          body=$(curl -s -m 20 https://api.pawpawcare.app/health)
          echo "GET /health -> $status $body"
          test "$status" = "200" && echo "$body" | grep -q '"status":"ok"'
