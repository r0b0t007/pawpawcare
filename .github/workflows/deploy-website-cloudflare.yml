# Deploys the marketing site (website/, including website/functions/) to
# Cloudflare Pages.
#
# Manual fallback only. Cloudflare's own Git integration deploys every push to
# main; running this on push too would race it (an older commit's slower CLI
# deploy can land after a newer one). Run it by hand if the Git integration is
# down. It needs the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets
# — see docs/deploy-website-cloudflare.md.

name: Deploy website (Cloudflare Pages)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: wrangler pages deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `wrangler pages deploy` only picks up a Functions route if it finds a
      # pre-built _worker.js in the deploy directory — it does NOT bundle
      # website/functions/ itself. Build it explicitly first (verified: a
      # deploy without this step silently serves 200 instead of routing to
      # the Function at all).
      - name: Build Pages Functions
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages functions build website/functions
            --outdir website/_worker.js
            --output-routes-path website/_routes.json
            --compatibility-date=2026-08-30

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=pawpawcare-website --branch=main
