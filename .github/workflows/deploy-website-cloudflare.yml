# Deploys the marketing site (website/ + functions/) to Cloudflare Pages.
#
# NOT active until the repo secrets below exist and DNS points pawpawcare.app
# at Cloudflare Pages — see docs/deploy-website-cloudflare.md. Netlify remains
# the live host (auto-deploy from main) until that migration is complete.

name: Deploy website (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "functions/**"
      - "wrangler.toml"
  workflow_dispatch:

jobs:
  deploy:
    name: wrangler pages deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=pawpawcare-website --branch=main
