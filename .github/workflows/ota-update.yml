# Triggered by pushes to main that touch frontend/ (or manually).
# Publishes an OTA (over-the-air) JS bundle update via EAS Update.
# Users receive it silently on their next app launch — no store review needed.

name: OTA Update

on:
  push:
    branches: [main]
    # Only frontend changes can affect the JS bundle. Without this filter every
    # website-, backend-, or docs-only merge republished an identical update.
    paths:
      - "frontend/**"
      - ".github/workflows/ota-update.yml"
  workflow_dispatch:
    inputs:
      message:
        description: "Update message shown in EAS dashboard"
        required: false
        default: "Manual OTA update"

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create env file
        # EXPO_PUBLIC_* vars are inlined into the JS bundle at publish time, so
        # every var the eas.json build profiles set MUST also be set here —
        # otherwise an OTA update silently strips them from installed apps
        # (e.g. an empty GOOGLE_WEB_CLIENT_ID hides the Google sign-in button).
        # The Google client IDs are public identifiers (already committed in
        # eas.json); the PostHog key is a public write-only client key.
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${{ secrets.BACKEND_URL }}"
            echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=493303263143-srop8lcrhgvavaulh9jlthjjokghl2qd.apps.googleusercontent.com"
            echo "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=493303263143-81gcusogeirf5gmjj5spk4b17v7m5hv6.apps.googleusercontent.com"
            echo "EXPO_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}"
          } >> .env.local

      - name: Publish OTA update
        # Pass the commit message via env (assigned literally by Actions), never
        # via ${{ }} inlined into the script — otherwise backticks/$() in a commit
        # message run as shell (breaks the step, and is a command-injection vector).
        env:
          COMMIT_MESSAGE: ${{ github.event.inputs.message || github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
          eas update --channel production --message "$MESSAGE" --non-interactive
