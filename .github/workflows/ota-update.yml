# Triggered by pushes to main that touch frontend/ (or manually).
# Publishes an OTA (over-the-air) JS bundle update via EAS Update.
# Users receive it silently on their next app launch — no store review needed.

name: OTA Update

on:
  push:
    branches: [main]
    # Only frontend changes can affect the JS bundle. Without this filter every
    # website-, backend-, or docs-only merge republished an identical update.
    # Not this workflow file itself: editing it would republish an identical
    # bundle as a new update. Test a workflow edit with a manual run instead.
    paths:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      message:
        description: "Update message shown in EAS dashboard"
        required: false
        default: "Manual OTA update"

# One publish at a time (CHW-254). Two merges seconds apart used to publish
# in parallel, and the older commit's update could finish last and become the
# one phones download. The queue alone doesn't stop an older commit from
# publishing (a re-run, or one already queued), so the `guard` job also skips
# any push run whose commit is no longer main's head.
concurrency:
  group: ota-update-production
  cancel-in-progress: false

jobs:
  guard:
    name: Still main's head?
    runs-on: ubuntu-latest
    # Publishing always goes to the production channel: only from main.
    if: github.ref == 'refs/heads/main'
    outputs:
      publish: ${{ steps.head.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare with main
        id: head
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git fetch --quiet --depth=1 origin main
          HEAD_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$EVENT" = "push" ] && [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer main's head (${HEAD_SHA:0:8}); the run for the newer commit publishes instead."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    name: Publish OTA update
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # A stuck publish would otherwise hold the queue for GitHub's 6-hour default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create env file
        # EXPO_PUBLIC_* vars are inlined into the JS bundle at publish time.
        # Generated from the eas.json `production` profile — the same source
        # store builds use — so an OTA update can never strip or change one.
        # The script fails on a missing profile or an empty value.
        run: node scripts/eas-env.js production > .env.local

      - name: Publish OTA update
        # Pass the commit message via env (assigned literally by Actions), never
        # via ${{ }} inlined into the script — otherwise backticks/$() in a commit
        # message run as shell (breaks the step, and is a command-injection vector).
        env:
          COMMIT_MESSAGE: ${{ github.event.inputs.message || github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
          eas update --channel production --message "$MESSAGE" --non-interactive

      - name: Upload source maps to Sentry
        # eas update leaves the exported bundle + maps in dist/. Without this,
        # crashes in OTA code show minified stack traces. Org/project come from
        # the @sentry/react-native/expo plugin in app.json. The update is
        # already live when this runs, so a failure is non-blocking: the job
        # stays green (a red run should mean the publish failed) and the step
        # shows up as a warning annotation instead.
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx sentry-expo-upload-sourcemaps dist
