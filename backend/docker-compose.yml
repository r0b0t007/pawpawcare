services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pawpawcare
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      # No default: a public fallback key would let anyone forge tokens (and
      # php-jwt rejects keys under 32 bytes anyway). Compose reads it from the
      # shell or backend/.env — replace the copied .env.example placeholder
      # once with e.g. `openssl rand -base64 48`, or sign-in returns 503.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random string of at least 32 characters}
      JWT_ALGO: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pawpawcare
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
